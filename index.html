<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="welcome">Welcome to our service</div>

    <div class="card">
        <h2>Customer Service</h2>
        <div class="group"><label>Enter customer name here:</label><input type="text" id="name" placeholder="Name"></div>
        <div class="group"><label>Start date of service:</label><input type="date" id="date"></div>
        <div class="group"><label>Cycle length (days):</label><input type="number" id="cycle" value="365"></div>
        <div class="group"><label>Amount Given:</label><input type="number" id="amount" placeholder="0.00"></div>
        <div class="group"><label>Product Taken:</label><input type="text" id="prod" placeholder="Product name"></div>
        <div class="group"><label>Products Details:</label><input type="text" id="details" placeholder="Product name"></div>

        <button class="btn-proceed" onclick="saveRecord()">Proceed</button>

        <div class="history">
            <strong>Past Logged</strong>
            <div id="history-list" class="history-list-wrapper"></div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeDisplay()"></div>
    <div id="details-display">
        <h3 style="color:var(--pink); margin-top:0;">Record Saved!</h3>
        <div id="display-content"></div>
        <button onclick="closeDisplay()" style="width:100%; padding:10px; background:#666; color:white; border:none; border-radius:8px; cursor:pointer; margin-top:15px;">Close View</button>
    </div>
<script src="script.js"></script>
    
</body>
</html>
